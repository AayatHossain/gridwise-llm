# Builds the fallback Docker image on every push to main and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest  and  ghcr.io/<owner>/<repo>:sha-<commit>
# Uses the repository's built-in GITHUB_TOKEN - no extra secrets needed. The image contains no API keys.
# After the submission deadline, set the package visibility to Public so judges can pull it
# (GitHub -> your profile -> Packages -> gridwise-llm -> Package settings -> Change visibility).
name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image (/health must answer)
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name gw -p 8000:8000 -e LLM_PROVIDER=none "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"ok"'; then echo "healthy"; docker rm -f gw; exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"; docker logs gw; docker rm -f gw; exit 1
